# ========================================
# Quality & Tests Workflow
# ========================================
#
# Purpose: Run tests, linting, and quality checks for Geocode ES (Go)
#
# What it does:
#   1. Runs unit tests (Go testing)
#   2. Runs linter (golangci-lint)
#   3. Generates test coverage report
#   4. Runs SonarCloud quality analysis
#
# Triggers:
#   - Push to main/develop branches
#   - Pull requests to main/develop branches
#   - Manual dispatch (allows testing specific branch)
#
# Quality Gates:
#   - Test coverage > 80%
#   - No linting errors
#   - No new SonarCloud issues
#
# Secrets Required:
#   - SONAR_TOKEN → SonarCloud authentication token
#
# ========================================

name: Quality & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'develop'
        type: choice
        options:
          - main
          - develop

# Required permissions for accessing organization secrets
permissions:
  contents: read    # Required for checking out the repository
  pull-requests: read  # Required for PR analysis in SonarCloud

jobs:
  quality:
    name: Run Quality Checks
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Step 1: Determine Target Branch
      # ========================================
      # For manual dispatch: uses the selected branch input
      # For automatic triggers: uses the triggering branch
      - name: Determine target branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "Using branch from input: $BRANCH"
          else
            BRANCH="${{ github.ref_name }}"
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "Using branch from trigger: $BRANCH"
          fi

      # ========================================
      # Step 2: Checkout Repository
      # ========================================
      # Downloads the repository code to the runner
      # Uses v4 for latest features and performance
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}

      # ========================================
      # Step 3: Setup Go Environment
      # ========================================
      # Installs Go 1.25 (required for building and testing)
      # cache: true → Caches Go modules for faster builds
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # ========================================
      # Step 4: Clean Previous Build Artifacts
      # ========================================
      # Ensures tests run against a fresh environment
      - name: Clean
        run: make clean

      # ========================================
      # Step 5: Install Dependencies
      # ========================================
      # Installs both Go and Infrastructure dependencies
      # Uses 'make install' to ensure complete environment
      - name: Install dependencies
        run: make install

      # ========================================
      # Step 6: Build Go Binary
      # ========================================
      # Compiles Go code to binary to verify buildability
      - name: Build
        run: make build

      # ========================================
      # Step 7: Run Go Tests with Coverage
      # ========================================
      # Runs Go test suite via Makefile
      # Generates coverage.out file for SonarCloud
      # continue-on-error: true → Allows SonarCloud to report failures
      - name: Run tests with coverage
        run: make test
        continue-on-error: true

      # ========================================
      # Step 7.1: Verify Coverage File
      # ========================================
      # Ensures coverage.out exists before SonarCloud scan
      - name: Verify coverage file exists
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "✅ Coverage file found: coverage.out"
            echo "📊 Coverage file size: $(wc -l < coverage.out) lines"
            echo "📊 First few lines:"
            head -5 coverage.out
          else
            echo "❌ ERROR: coverage.out not found!"
            echo "Current directory: $(pwd)"
            echo "Files in current directory:"
            ls -la | head -20
            exit 1
          fi

      # ========================================
      # Step 8: SonarCloud Quality Analysis
      # ========================================
      # Uploads results to SonarCloud dashboard
      # Includes coverage report from coverage.out
      # if: always() → Runs even if previous steps failed
      - name: SonarCloud Scan
        if: always()
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.go.coverage.reportPaths=coverage.out
