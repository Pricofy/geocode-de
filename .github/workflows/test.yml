name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'develop'
        type: choice
        options:
          - main
          - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      # Setup Go (primary language)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Clean previous artifacts
      - name: Clean
        run: make clean

      # Install Go dependencies
      - name: Install Go dependencies
        run: make install

      # Build Go binary
      - name: Build
        run: make build

      # Run Go tests with coverage (via Makefile)
      - name: Run tests with coverage
        run: make test
        continue-on-error: true

      # Run linter
      - name: Run linter
        run: make lint
        continue-on-error: true

      # SonarCloud analysis
      - name: SonarCloud Scan
        if: always()
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

