# ========================================
# Deploy Geocode ES Workflow
# ========================================
#
# Purpose: Deploy the Spanish Geocoding Service Lambda to AWS via CDK
#
# Triggers:
#   - Push to develop → Auto-deploy to DEV environment
#   - Manual dispatch → Deploy to DEV or PROD (user choice)
#
# Environments:
#   - dev  → Development (auto on push to develop)
#   - prod → Production (manual dispatch only)
#
# AWS Authentication:
#   Uses OIDC (OpenID Connect) with IAM roles for secure, keyless auth
#   No long-lived credentials stored in GitHub Secrets
#
# Secrets Required:
#   - AWS_ACCOUNT_ID_DEV  → AWS account for dev environment
#   - AWS_ACCOUNT_ID_PROD → AWS account for prod environment
#
# Note: Role ARN is automatically constructed using the generic role name:
#   - arn:aws:iam::${ACCOUNT_ID}:role/GitHubActionsDeployRole
# This role is created by pricofy-infra CicdStack and shared across all services.
# Same name in both dev and prod accounts (different accounts = no naming conflict).
#
# ========================================

name: Deploy Geocode ES

on:
  # Automatic deployment to dev when code is pushed to develop branch
  push:
    branches: [develop]
  
  # Manual deployment trigger via GitHub UI (allows choosing environment)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Required permissions for OIDC authentication with AWS
permissions:
  id-token: write   # Required for requesting JWT from GitHub OIDC provider
  contents: read    # Required for checking out the repository

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    
    steps:
      # ========================================
      # Step 1: Checkout Repository
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================
      # Step 2: Determine Target Environment
      # ========================================
      # Uses the environment from push (develop → dev) or workflow_dispatch input
      #
      # Sets outputs:
      #   - environment: Target environment (dev/prod)
      #   - account_id: AWS account ID for target environment
      #   - role_arn: IAM role ARN for deployment
      - name: Determine environment
        id: env
        run: |
          set -e
          
          if [ "${{ github.event_name }}" == "push" ]; then
            ENVIRONMENT="dev"
            echo "🔍 Auto-deploying to DEV (push to develop branch)"
          else
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            ENVIRONMENT="${ENVIRONMENT:-dev}"
            echo "🔍 Manual deployment to: ${ENVIRONMENT}"
          fi
          
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          
          # Use generic deployment role created by pricofy-infra CicdStack
          # Same role name in both dev and prod accounts (different accounts = no conflict)
          # Role name: GitHubActionsDeployRole (defined in pricofy-infra/lib/stacks/cicd-stack.ts)
          if [ "${ENVIRONMENT}" == "prod" ]; then
            ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID_PROD }}"
            echo "📦 Using PROD credentials"
          else
            ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID_DEV }}"
            echo "📦 Using DEV credentials"
          fi
          
          # Generic role name (same in both accounts, created by CicdStack)
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/GitHubActionsDeployRole"
          
          # Validate that account ID secret is not empty
          if [ -z "${ACCOUNT_ID}" ]; then
            echo "❌ ERROR: AWS_ACCOUNT_ID_${ENVIRONMENT^^} secret is empty or not set"
            exit 1
          fi
          
          # Validate account ID format (12 digits)
          if [[ ! "${ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "❌ ERROR: Invalid account ID format: ${ACCOUNT_ID}"
            echo "Expected format: 12-digit number"
            exit 1
          fi
          
          echo "✅ Account ID: ${ACCOUNT_ID}"
          echo "✅ Role ARN: ${ROLE_ARN}"
          
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "role_arn=${ROLE_ARN}" >> $GITHUB_OUTPUT
          
          echo "✅ Environment configuration complete"

      # ========================================
      # Step 3: Setup Go Environment
      # ========================================
      # Installs Go 1.24 (required for Lambda binary compilation)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # ========================================
      # Step 4: Setup Node.js Environment
      # ========================================
      # Installs Node.js 20.x (required for CDK infrastructure deployment)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ========================================
      # Step 5: Pre-pull SAM Build Image
      # ========================================
      # Pulls the SAM build image used by CDK for Lambda bundling
      # Uses Docker layer cache from previous step
      # Prevents CDK from pulling the image during deployment
      - name: Pre-pull SAM build image
        run: |
          docker pull public.ecr.aws/sam/build-provided.al2023:latest

      # ========================================
      # Step 6: Configure AWS Credentials (OIDC)
      # ========================================
      # Authenticates with AWS using OIDC (no long-lived keys)
      # Assumes the IAM role specific to target environment
      # Role permissions: CDK deployment, Lambda updates, CloudFormation
      - name: Configure AWS credentials
        run: |
          echo "🔐 Attempting to assume role: ${{ steps.env.outputs.role_arn }}"
          if [ -z "${{ steps.env.outputs.role_arn }}" ]; then
            echo "❌ ERROR: role_arn output is empty"
            exit 1
          fi
        continue-on-error: false
        
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.role_arn }}
          aws-region: eu-west-1
          role-session-name: GitHubActions-GeocodeES-${{ steps.env.outputs.environment }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      # ========================================
      # Step 7: Verify Deployment Prerequisites (REQUIRED)
      # ========================================
      # Validates prerequisites before deployment:
      #   - AWS CLI configured
      #   - CDK Bootstrap complete
      #   - GitHub OIDC provider configured
      #   - GitHub Actions IAM role exists
      - name: Verify deployment prerequisites
        run: make verify ENV=${{ steps.env.outputs.environment }}

      # ========================================
      # Step 8: Deploy Geocode ES (via Makefile)
      # ========================================
      # CRITICAL: Uses 'make deploy' which includes:
      #   1. Clean: Removes previous artifacts
      #   2. Install: Go dependencies (go mod tidy)
      #   3. Build: Compiles Go binary for Lambda (Linux/AMD64)
      #   4. Test: Runs test suite (BLOCKS deployment if fails)
      #   5. Deploy: CDK deployment to AWS
      #
      # This ensures tests ALWAYS run before deployment.
      # No code reaches production without passing tests.
      #
      # What gets deployed:
      #   - Single Lambda function (Go binary with custom runtime)
      #   - IAM roles and policies
      #   - CloudWatch log groups
      #   - Data: 11,150 Spanish postal codes (embedded in binary)
      - name: Deploy Geocode ES to ${{ steps.env.outputs.environment }}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.env.outputs.account_id }}
          CDK_DEFAULT_REGION: eu-west-1
        run: make deploy ENV=${{ steps.env.outputs.environment }}

      # ========================================
      # Step 9: Notify Deployment Status
      # ========================================
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Geocode ES deployed successfully to ${{ steps.env.outputs.environment }}"
            echo "Complete process: clean → install → build → test → deploy (via make deploy)"
            echo ""
            echo "📊 Deployed:"
            echo "   - Single Lambda: pricofy-geocode-es-${{ steps.env.outputs.environment }}"
            echo "   - Runtime: Go 1.25 (PROVIDED_AL2023)"
            echo "   - 6 operations (geocode, reverse, validate x2, autocomplete x2)"
            echo "   - 11,150 Spanish postal codes (embedded)"
          else
            echo "❌ Geocode ES deployment failed"
            exit 1
          fi
