# SonarCloud configuration for pricofy-geocode-es
# Go implementation with hexagonal architecture and dependency injection

# Project identification
sonar.organization=pricofy
sonar.projectKey=pricofy_pricofy-geocode-es
sonar.projectName=pricofy-geocode-es
# Version is automatically detected from git tags

# Source and test directories (Go structure with co-located tests)
sonar.sources=cmd,internal
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go

# Exclusions
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/infrastructure/**,\
  **/test/e2e/**,\
  **/*.pb.go,\
  **/mock_*.go

sonar.test.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/infrastructure/**

sonar.coverage.exclusions=\
  **/infrastructure/**,\
  **/test/e2e/**,\
  **/mock_*.go,\
  **/*_test.go

# Go configuration
sonar.go.coverage.reportPaths=coverage.out

# Source encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git

