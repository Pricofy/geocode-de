# SonarCloud configuration for pricofy-geocode-es

# Project identification
sonar.organization=pricofy
sonar.projectKey=pricofy_pricofy-geocode-es
sonar.projectName=pricofy-geocode-es
# Note: sonar.projectVersion is automatically read from package.json

# Source and test directories
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/infrastructure/**,\
  **/data/**

sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**

sonar.coverage.exclusions=\
  **/*.d.ts,\
  **/test/**,\
  **/infrastructure/**,\
  **/data/**

# TypeScript/JavaScript configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git

