openapi: 3.1.0
info:
  title: Pricofy Geocode ES API
  description: |
    Spanish postal code geocoding, validation, and autocomplete microservice.
    
    This service provides 6 operations for Spanish postal codes:
    - **geocode-by-postal**: Convert postal code to coordinates
    - **reverse-geocode**: Find nearest postal code from coordinates
    - **validate-postal**: Check if postal code exists
    - **validate-municipio**: Check if municipality exists
    - **autocomplete-postal**: Prefix-based postal code search
    - **autocomplete-municipio**: Fuzzy municipality search
    
    **Architecture**: Single Lambda function with internal routing via `operation` parameter.
    
    **Invocation**: Internal service invoked by `pricofy-location-service` via AWS Lambda SDK (no HTTP/API Gateway).
    
    **Data Source**: Static database of 11,150 Spanish postal codes from GeoNames.
    
    **Performance**: <1ms postal lookup, ~10-20ms reverse geocode, <5ms autocomplete.
  version: 1.0.0
  contact:
    name: Pricofy Team
    email: dev@pricofy.com
  license:
    name: Private

servers:
  - url: https://lambda.eu-west-1.amazonaws.com
    description: AWS Lambda (Internal - IAM auth only)

tags:
  - name: Geocoding
    description: Convert postal codes and municipalities to coordinates
  - name: Validation
    description: Validate postal codes and municipalities
  - name: Autocomplete
    description: Search and autocomplete postal codes and municipalities

paths:
  /invoke:
    post:
      summary: Invoke geocode operation
      description: |
        Single entry point for all geocode operations. The `operation` parameter determines which operation to execute.
        
        **Note**: This is an internal Lambda function invoked via AWS SDK, not HTTP. This spec documents the payload structure.
      tags:
        - Geocoding
        - Validation
        - Autocomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GeocodeByPostalRequest'
                - $ref: '#/components/schemas/ReverseGeocodeRequest'
                - $ref: '#/components/schemas/ValidatePostalRequest'
                - $ref: '#/components/schemas/ValidateMunicipioRequest'
                - $ref: '#/components/schemas/AutocompletePostalRequest'
                - $ref: '#/components/schemas/AutocompleteMunicipioRequest'
              discriminator:
                propertyName: operation
            examples:
              geocode-by-postal:
                summary: Geocode by postal code
                value:
                  operation: geocode-by-postal
                  postalCode: "28001"
              reverse-geocode:
                summary: Reverse geocode
                value:
                  operation: reverse-geocode
                  lat: 40.4168
                  lon: -3.7038
              validate-postal:
                summary: Validate postal code
                value:
                  operation: validate-postal
                  postalCode: "28001"
              validate-municipio:
                summary: Validate municipality
                value:
                  operation: validate-municipio
                  municipio: "Madrid"
              autocomplete-postal:
                summary: Autocomplete postal code
                value:
                  operation: autocomplete-postal
                  prefix: "280"
                  limit: 5
              autocomplete-municipio:
                summary: Autocomplete municipality
                value:
                  operation: autocomplete-municipio
                  query: "mad"
                  limit: 5
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GeocodeResponse'
                  - $ref: '#/components/schemas/ReverseGeocodeResponse'
                  - $ref: '#/components/schemas/ValidationResponse'
                  - $ref: '#/components/schemas/AutocompleteResponse'
        '400':
          description: Bad request (invalid input)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found (postal code or municipality not in database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # Request schemas
    GeocodeByPostalRequest:
      type: object
      required:
        - operation
        - postalCode
      properties:
        operation:
          type: string
          enum: [geocode-by-postal]
        postalCode:
          type: string
          pattern: '^\d{5}$'
          example: "28001"
          description: Spanish postal code (5 digits)
        municipio:
          type: string
          example: "Madrid"
          description: Optional fallback if postal code not found

    ReverseGeocodeRequest:
      type: object
      required:
        - operation
        - lat
        - lon
      properties:
        operation:
          type: string
          enum: [reverse-geocode]
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 40.4168
          description: Latitude
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -3.7038
          description: Longitude

    ValidatePostalRequest:
      type: object
      required:
        - operation
        - postalCode
      properties:
        operation:
          type: string
          enum: [validate-postal]
        postalCode:
          type: string
          example: "28001"
          description: Postal code to validate

    ValidateMunicipioRequest:
      type: object
      required:
        - operation
        - municipio
      properties:
        operation:
          type: string
          enum: [validate-municipio]
        municipio:
          type: string
          example: "Madrid"
          description: Municipality to validate

    AutocompletePostalRequest:
      type: object
      required:
        - operation
        - prefix
      properties:
        operation:
          type: string
          enum: [autocomplete-postal]
        prefix:
          type: string
          example: "280"
          description: Postal code prefix (1-5 digits)
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          example: 5
          description: Maximum number of results

    AutocompleteMunicipioRequest:
      type: object
      required:
        - operation
        - query
      properties:
        operation:
          type: string
          enum: [autocomplete-municipio]
        query:
          type: string
          example: "mad"
          description: Municipality search query
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          example: 5
          description: Maximum number of results

    # Response schemas
    GeocodeResponse:
      type: object
      required:
        - success
        - coords
        - municipio
        - provincia
        - postalCode
        - source
      properties:
        success:
          type: boolean
          example: true
        coords:
          $ref: '#/components/schemas/Coordinates'
        municipio:
          type: string
          example: "Madrid"
        provincia:
          type: string
          example: "Madrid"
        postalCode:
          type: string
          example: "28001"
        source:
          type: string
          enum: [postal_code, municipio]
          description: Source used for geocoding

    ReverseGeocodeResponse:
      type: object
      required:
        - success
        - city
        - postalCode
        - provincia
        - country
        - coords
        - distance
      properties:
        success:
          type: boolean
          example: true
        city:
          type: string
          example: "Madrid"
        postalCode:
          type: string
          example: "28001"
        provincia:
          type: string
          example: "Madrid"
        country:
          type: string
          example: "España"
        coords:
          $ref: '#/components/schemas/Coordinates'
        distance:
          type: number
          format: double
          example: 0.142
          description: Distance to nearest postal code centroid (km)

    ValidationResponse:
      type: object
      required:
        - valid
        - value
      properties:
        valid:
          type: boolean
          example: true
        value:
          type: string
          example: "28001"
          description: The value that was validated

    AutocompleteResponse:
      type: object
      required:
        - results
        - count
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AutocompleteItem'
        count:
          type: integer
          example: 5
          description: Number of results returned

    AutocompleteItem:
      type: object
      required:
        - postalCode
        - municipio
        - provincia
      properties:
        postalCode:
          type: string
          example: "28001"
        municipio:
          type: string
          example: "Madrid"
        provincia:
          type: string
          example: "Madrid"

    Coordinates:
      type: object
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: double
          example: 40.4168
        lon:
          type: number
          format: double
          example: -3.7038

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Postal code not found"
        hint:
          type: string
          example: "Please provide a valid Spanish postal code"
          description: Optional hint for fixing the error
        details:
          type: string
          example: "Database connection lost"
          description: Error details (only in dev environment)
